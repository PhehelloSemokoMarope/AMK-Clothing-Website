<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AMK Clothing - Sign Up</title>
  <link rel="stylesheet" href="../Styling/StyleSheet.css">
  
</head>
<body>

  <div class="auth-container">
    <img src="../Images/scissors.png" alt="Scissors Logo" class="auth-logo">
    <div class="auth-title">AMK Clothing</div>
    <div class="auth-subtitle">Fashion Design Management System</div>
    
    <form id="signup-form">
      <div class="input-group">
        <label>Name *</label>
        <input type="text" id="signup-name" placeholder="Enter your name" required>
      </div>

      <div class="input-group">
        <label>Surname *</label>
        <input type="text" id="signup-surname" placeholder="Enter your surname" required>
      </div>

      <div class="input-group">
        <label>Email Address *</label>
        <input type="email" id="signup-email" placeholder="Enter your email" required>
      </div>

      <div class="input-group">
        <label>Requested Role *</label>
        <select id="signup-role" required>
          <option value="Staff">Staff</option>
          <option value="Designer">Designer</option>
          <option value="Administrator">Administrator</option>
        </select>
      </div>

      <div class="input-group">
        <label>Password *</label>
        <input type="password" id="signup-password" placeholder="Create a password" required>
      </div>

      <div class="input-group">
        <label>Confirm Password *</label>
        <input type="password" id="signup-confirm-password" placeholder="Confirm your password" required>
      </div>

      <button type="submit" class="btn-auth">Sign Up</button>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="SignIn.html">Sign In</a>
    </div>
  </div>

  <script type="module" src="../Javascript/app.js"></script>
</body>
</html>
