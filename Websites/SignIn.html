<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FDMS - Sign In</title>
    <link rel="stylesheet" href="../Styling/StyleSheet.css">
</head>
<body class="login-body">
    
    <div class="login-card">
        <div class="login-header">
            <div class="login-icon">
                <img src="../Images/scissors.png" alt="Scissors" style="width: 24px; filter: brightness(0) invert(1);">
            </div>
            <h2>FDMS</h2>
            <p>Fashion Design Management System</p>
        </div>

        <form id="login-form">
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="admin@fdms.co.za" required>
            </div>
            
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>
            
            <button type="submit" class="login-btn">➔ Sign In</button>
            
        </form>
    </div>

 <script>
    const signInForm = document.getElementById('signin-form');

    if (signInForm) {
        signInForm.addEventListener('submit', function(e) {
            e.preventDefault();

            const email = document.getElementById('signin-email').value;
            const password = document.getElementById('signin-password').value;

        
            fetch('http://localhost:3000/api/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ email, password })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
    
                    localStorage.setItem('loggedInUser', data.name);
                    
                    alert('Login successful!');
        
                    window.location.href = 'Homepage.html';
                } else {
                    alert(data.message || 'Invalid login details.');
                }
            })
            .catch(error => {
                console.error('Error connecting to server:', error);
                alert('Could not connect to the server. Make sure your Node.js server is running.');
            });
        });
    }
</script>
</body>
</html>
