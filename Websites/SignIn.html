<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FDMS - Sign In</title>
    <link rel="stylesheet" href="../Styling/StyleSheet.css">
</head>
<body class="login-body">
    
    <div class="login-card">
        <div class="login-header">
            <div class="login-icon">
                <img src="../Images/scissors.png" alt="Scissors" style="width: 24px; filter: brightness(0) invert(1);">
            </div>
            <h2>FDMS</h2>
            <p>Fashion Design Management System</p>
        </div>

        <form id="login-form">
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="admin@fdms.co.za" required>
            </div>
            
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>
            
            <button type="submit" class="login-btn">➔ Sign In</button>
            
        </form>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            window.location.href = 'Homepage.html';
        });
    </script>
</body>
</html>
