<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMK Clothing | Create Account</title>
    <link rel="stylesheet" href="Styling/StyleSheet.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-body">

    <div class="auth-container" style="max-width: 500px; width: 100%;">
        <h2 class="auth-title">Create an Account</h2>
        <p class="auth-subtitle">Join AMK Clothing to track custom orders, save to your wishlist, and manage your cart.</p>

        <form id="client-signup-form">
            <div style="display: flex; gap: 15px;">
                <div class="input-group" style="flex: 1; min-width: 0;">
                    <label for="client-name">First Name</label>
                    <input type="text" id="client-name" name="client-name" required 
                           pattern="^[a-zA-Z\s]{2,50}$" 
                           title="First name must contain only letters and spaces (2-50 characters)." 
                           placeholder="e.g. John">
                </div>

                <div class="input-group" style="flex: 1; min-width: 0;">
                    <label for="client-surname">Last Name</label>
                    <input type="text" id="client-surname" name="client-surname" required 
                           pattern="^[a-zA-Z\s]{2,50}$" 
                           title="Last name must contain only letters and spaces (2-50 characters)." 
                           placeholder="e.g. Doe">
                </div>
            </div>

            <div class="input-group">
                <label for="client-phone">Phone Number</label>
                <input type="tel" id="client-phone" name="client-phone" required 
                       pattern="^(?:\+27|0)[0-9]{9}$" 
                       title="Please enter a valid South African phone number (e.g., 0821234567 or +27821234567)." 
                       placeholder="082 123 4567">
            </div>

            <div class="input-group">
                <label for="client-email">Email Address</label>
                <input type="email" id="client-email" name="client-email" required 
                       pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$" 
                       title="Please enter a valid email address (e.g., name@example.com)." 
                       placeholder="your.email@example.com">
            </div>

            <div style="display: flex; gap: 15px;">
                <div class="input-group" style="flex: 1; min-width: 0;">
                    <label for="client-password">Password</label>
                    <div style="position: relative;">
                        <input type="password" id="client-password" name="client-password" required 
                               pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" 
                               title="Password must contain at least one number, one uppercase letter, one lowercase letter, and be at least 8 characters long." 
                               placeholder="Create password" style="padding-right: 35px;">
                        <i class="fas fa-eye" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #777;" onclick="togglePasswordVisibility(this, 'client-password')"></i>
                    </div>
                </div>

                <div class="input-group" style="flex: 1; min-width: 0;">
                    <label for="client-confirm-password">Confirm Password</label>
                    <div style="position: relative;">
                        <input type="password" id="client-confirm-password" name="client-confirm-password" required 
                               placeholder="Repeat password" style="padding-right: 35px;">
                        <i class="fas fa-eye" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #777;" onclick="togglePasswordVisibility(this, 'client-confirm-password')"></i>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn-auth" style="margin-top: 20px;">Create Account</button>
        </form>

        <div class="auth-footer" style="margin-top: 25px;">
            <p>Already have an account? <a href="ClientSignInForm.html">Sign In</a></p>
            <p style="margin-top: 10px;"><a href="index.html" style="color: #666; font-weight: normal;"><i class="fas fa-arrow-left"></i> Back to Store</a></p>
        </div>
    </div>

    <script>
        function togglePasswordVisibility(icon, inputId) {
            const input = document.getElementById(inputId);
            if (input.type === "password") {
                input.type = "text";
                icon.classList.remove("fa-eye");
                icon.classList.add("fa-eye-slash");
            } else {
                input.type = "password";
                icon.classList.remove("fa-eye-slash");
                icon.classList.add("fa-eye");
            }
        }
    </script>
    <script type="module" src="Javascript/clientapp.js"></script>
</body>
</html>
