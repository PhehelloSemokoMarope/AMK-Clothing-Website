<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AMK Clothing - Sign In</title>
  <link rel="stylesheet" href="../Styling/StyleSheet.css">
    
</head>
<body class="auth-body">

  <div class="auth-container">
    <img src="../Images/scissors.png" alt="Scissors Logo" class="auth-logo">
    <div class="auth-title">AMK Clothing</div>
    <div class="auth-subtitle">Fashion Design Management System</div>
    
    <form id="login-form">
      <div class="input-group">
        <label>Email Address :</label>
        <input type="email" id="email" placeholder="Enter your email" required>
      </div>

      <div class="input-group">
        <label>Password :</label>
        <input type="password" id="password" placeholder="Enter your password" required>
      </div>

      <button type="submit" class="btn-auth">Sign In</button>
    </form>

    <div class="auth-divider">
      <span>OR</span>
    </div>

    <a href="SignUp.html" class="btn-secondary-auth">Create an Account (Sign Up)</a>
  </div>

  <script type="module" src="../Javascript/app.js"></script>
</body>
</html>
